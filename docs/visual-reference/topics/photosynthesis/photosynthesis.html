<!doctype html>
<!-- Scene: how photosynthesis works in a leaf. Cut-through of a leaf (epidermis, palisade, spongy layer, stomata),
     a stalk with xylem (water in) and phloem (sugar out). Colour = meaning: blue water, orange carbon dioxide,
     yellow light, pale green reflected light, lavender oxygen, cream sugar. Cyan stays for labels. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <script src="bx.js"></script>
    <link rel="stylesheet" href="bx.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="LEARN_TOTAL" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="LEARN_TOTAL" data-track-index="0">
        <script type="application/json" id="narration">[
          "A leaf is a small solar factory, and it makes its food from three ingredients: carbon dioxide, water, and light.",
          "Carbon dioxide enters through tiny pores called stomata, which open and close to let gas in and out.",
          "Water comes up from the roots through veins, a tube called xylem, and reaches the cells that need it.",
          "Inside the leaf, cells are packed with chloroplasts, and chlorophyll absorbs light, mostly red and blue.",
          "Green is reflected, which is why leaves look green. Light energy splits water, and the oxygen leaves through the stomata.",
          "That energy builds sugar, a molecule called glucose, from carbon dioxide and water.",
          "The sugar feeds the plant, and is carried away through the veins in a tube called phloem.",
          "Overall, six carbon dioxide and six water molecules, plus light, make one glucose and six oxygen."
        ]</script>
        <script type="application/json" id="pauses">{"3": 0.8}</script>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      BX.init(tl, { bg: "studio", section: "Photosynthesis",
        basis: "Simplified cut-through of a leaf, not to scale. Colours mark roles, not true colours. The equation is the overall summary." });
      const C = BX.C;
      {
        // ---- colours by meaning (chosen once; cyan stays for labels) ----
        const WATER = "#4f8fd6", WATER_L = "#9cc8f0", SUGAR = "#f4efe0", PHLOEM = "#d9b46a", PHLOEM_L = "#fff4d6";
        const OXY = "#d9d4ff", LEAFG = "#8fd16a", LEAF = "#a9c48a", EPI = "#5d7a4b", PALI = "#c5dc8f", CHL = "#3f8c3a";
        const SPONGE = "#dce8b8", SPONGE_E = "#9cb87a", STALK = "#6b5a3a";

        // ---- the leaf: cut-through body, palisade row, spongy layer, epidermis, stomata ----
        const body = BX.shape("M300 530 C300 420 360 360 460 360 H1460 C1560 360 1620 420 1620 530 C1620 640 1560 700 1460 700 H460 C360 700 300 640 300 530 Z", LEAF, { finish: "matte" });
        const epiU = BX.S("path", { d: "M400 388 H1520", stroke: EPI, "stroke-width": 6, fill: "none" });
        const epiL = BX.S("path", { d: "M400 690 H1520", stroke: EPI, "stroke-width": 6, fill: "none" });
        const palCells = [], pal = [];
        for (let i = 0; i < 23; i++) {
          const x = 400 + i * 46;
          const cell = BX.part(x, 392, 40, 124, PALI, { finish: "matte" });
          palCells.push(cell);
          pal.push(cell,
            BX.S("ellipse", { cx: x + 12, cy: 430, rx: 8, ry: 6, fill: CHL }),
            BX.S("ellipse", { cx: x + 28, cy: 485, rx: 8, ry: 6, fill: CHL }));
        }
        const R = BX.rand(5), spong = [];
        for (let row = 0; row < 3; row++) for (let i = 0; i < 16; i++)
          spong.push(BX.S("circle", { cx: 420 + i * 62 + (row % 2) * 30 + R() * 10, cy: 565 + row * 42 + R() * 8,
            r: 20 + R() * 6, fill: SPONGE, stroke: SPONGE_E, "stroke-width": 3 }));
        const SX = [560, 880, 1100, 1380];
        const stoma = SX.map((x) => BX.S("ellipse", { cx: x, cy: 692, rx: 18, ry: 5, fill: "#0f1d24" }));
        const leafEls = [body, epiU, epiL, ...pal, ...spong, ...stoma];

        // ---- stalk (always there), xylem and phloem inside it ----
        const stalk = BX.pipe("M960 680 V1060", { w: 120, color: STALK });
        const xylem = BX.pipe("M925 1060 V600 H1400 M925 600 H500", { w: 30, color: WATER });
        const phloem = BX.pipe("M995 600 V1060", { w: 30, color: PHLOEM });
        BX.hideNow([xylem.g, phloem.g]);
        BX.hideNow(leafEls);

        // ---- line 0: the ingredients; the leaf appears under the title ----
        BX.cam.set(960, 540, 1.1);
        const ttl = BX.title(T(0, 0), "How a leaf makes sugar", { y: 110, sub: "photosynthesis" });
        ttl.hide(T(0, 0.35));
        BX.show(T(0, 0.05), leafEls, { pop: true });

        // ---- line 1: carbon dioxide in through the stomata ----
        BX.cam.move(T(1, 0), 700, 640, 1.5, 2.5);
        tl.to(stoma, { attr: { ry: 14 }, duration: 0.6 }, T(1, 0.4));
        const co2 = BX.arrow(T(1, 0.06), [[560, 960], [560, 706]], { color: C.move, w: 10, dur: 1.0 });
        const kCO2 = BX.callout(T(1, 0.06), 560, 930, 600, 880, "Carbon dioxide");
        const kStoma = BX.callout(T(1, 0.5), 880, 692, "Stoma", { avoid: [[860, 600, 40, 100]] });
        co2.hide(T(2, 0)); kCO2.hide(T(2, 0)); kStoma.hide(T(2, 0));

        // ---- line 2: water up the xylem ----
        BX.cam.move(T(2, 0), 960, 760, 1.2, 2.0);
        BX.show(T(2, 0), [xylem.g]);
        BX.flow(T(2, 0.15), "M925 1060 V600 H1400", WATER_L, 4);
        BX.flow(T(2, 0.15), "M925 600 H500", WATER_L, 3);
        const kXy = BX.callout(T(2, 0.6), 925, 860, "Xylem", { avoid: [[895, 600, 60, 460]] });
        kXy.hide(T(3, 0));

        // ---- line 3: chloroplasts absorb red and blue light ----
        BX.cam.move(T(3, 0), 960, 470, 1.35, 2.0);
        const lightX = [480, 1240];
        const light = lightX.map((x, i) => BX.arrow(T(3, 0.7 + i * 0.05), [[x, 110], [x, 380]], { color: C.energy, w: 10, dur: 0.8 }));
        const kLight = BX.callout(T(3, 0.72), 480, 110, "Light", { avoid: [[460, 100, 40, 290]] });
        const kChl = BX.callout(T(3, 0.46), 780, 430, 780, 280, "Chloroplast");

        // ---- line 4: green is reflected; water splits, oxygen leaves through a stoma ----
        light.forEach((a) => a.hide(T(4, 0)));
        kLight.hide(T(4, 0)); kChl.hide(T(4, 0));
        BX.cam.move(T(4, 0), 1080, 520, 1.6, 2.0);
        const refl = BX.arrow(T(4, 0.02), [[1380, 380], [1440, 260], [1500, 190]], { color: LEAFG, w: 10, curve: true, dur: 1.0 });
        const kGreen = BX.callout(T(4, 0.1), 1500, 190, "Green light", { avoid: [[1480, 170, 40, 40]] });
        kGreen.hide(T(5, 0));
        BX.pulse(T(4, 0.55), palCells[15], 1.2, 0.4);
        const o2 = [T(4, 0.7), T(4, 0.78), T(4, 0.86)].map((t) => BX.packet(t, [[1100, 450], [1100, 692], [1100, 840]], OXY, 1.6));
        const kO2 = BX.callout(T(4, 0.8), 1100, 790, "Oxygen", { avoid: [[1080, 690, 40, 160]] });
        refl.hide(T(5, 0)); kO2.hide(T(5, 0));

        // ---- line 5: the energy builds glucose from carbon dioxide and water ----
        BX.cam.move(T(5, 0), 1150, 500, 1.5, 2.0);
        const glu = [0, 1, 2, 3, 4, 5].map((k) => {
          const a = k * Math.PI / 3;
          return BX.S("circle", { cx: 1250 + 40 * Math.cos(a), cy: 470 + 40 * Math.sin(a), r: 20, fill: SUGAR, stroke: "#b8ad8a", "stroke-width": 3 });
        });
        BX.hideNow(glu);
        BX.show(T(5, 0.3), glu, { pop: true });
        const kGlu = BX.callout(T(5, 0.6), 1250, 470, "Glucose", { avoid: [[1200, 420, 100, 100]] });
        kGlu.hide(T(6, 0));

        // ---- line 6: sugar carried away through the phloem ----
        BX.cam.move(T(6, 0), 960, 820, 1.1, 2.0);
        BX.show(T(6, 0), [phloem.g]);
        BX.flow(T(6, 0.3), "M995 600 V1060", PHLOEM_L, 4);
        const kPh = BX.callout(T(6, 0.92), 995, 900, "Phloem", { avoid: [[965, 600, 60, 460]] });
        kPh.hide(T(7, 0));

        // ---- line 7: the overall equation, whole leaf in view ----
        BX.cam.move(T(7, 0), 960, 540, 0.95, 2.0);
        BX.label(T(7, 0.1), 960, 150, "6 CO2 + 6 H2O + light → C6H12O6 + 6 O2", { anchor: "center", size: 60, color: C.text, hud: true });
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
