<!doctype html>
<!-- Worked example: reading one DRAM cell, in the BX kit style (labels only, no captions).
     Copy it, keep the page skeleton (head, #root, #stage, the timeline lines), rewrite the narration and the scene block. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <script src="bx.js"></script>
    <link rel="stylesheet" href="bx.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="LEARN_TOTAL" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="LEARN_TOTAL" data-track-index="0">
        <script type="application/json" id="narration">[
          "This is one DRAM memory cell: a transistor that works as a switch, and a capacitor that stores charge.",
          "To read it, the wordline turns on, the switch closes, and the capacitor is joined to the bitline.",
          "Charge spills out onto the bitline and nudges its voltage up, from half a volt to about point six five.",
          "At the bottom, the sense amplifier notices that small rise and decides the cell holds a one.",
          "Reading drained some charge, so the amplifier drives the bitline to a full volt and refills the capacitor.",
          "So every read ends with a rewrite. Reading a DRAM cell destroys it, and the chip repairs it at once."
        ]</script>
        <script type="application/json" id="pauses">{"2": 1.0}</script>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      BX.init(tl, { bg: "board", section: "Reading a cell", basis: "Schematic, not to scale. Voltages simplified to a 1 V supply." });
      const C = BX.C;
      { // ---- the scene: draw everything first (world pixels), then add events at the words they belong to ----
        // physical layout: wordline across the top, bitline down the left, the cell between them
        const WL = 300, BLX = 560, FX = 900, FY = 520, CX = 1180, CY = 660;
        const wl = BX.wire(0, WL, 1920, WL, { w: 16 });
        const bl = BX.wire(BLX, 0, BLX, 860, { w: 16 });
        const fet = BX.fetSym(FX, FY, { w: 200 });
        BX.tube(`M${FX} ${FY - 46} V${WL}`, { w: 8, color: C.beige, glow: C.beige });                    // gate to wordline
        BX.tube(`M${FX - 130} ${FY} H${BLX}`, { w: 8, color: C.copper });                                 // channel to bitline
        BX.tube(`M${FX + 130} ${FY} H${CX} V${CY - 6}`, { w: 8, color: C.copper });                        // channel to capacitor
        const cap = BX.capSym(CX, CY, { w: 200, gap: 34, charged: true });
        BX.tube(`M${CX} ${CY + 48} V${CY + 90}`, { w: 8, color: C.copper });
        BX.ground(CX, CY + 92);
        const amp = BX.plate(BLX - 150, 860, 300, 130, "Sense amp", { size: 44 });
        const bit = BX.badge(CX + 130, CY - 44, { size: 90, value: "1" });
        BX.hideNow([bit.el]);

        // line 0: title card, then name the two parts as they are spoken
        BX.cam.set(FX + 100, FY + 120, 1.25);
        const ttl = BX.title(T(0, 0), "1T1C DRAM Memory Cell", { y: 90, sub: "one transistor, one capacitor" });
        ttl.hide(T(0, 0.42));
        const L1 = BX.lens(T(0, 0.48), FX, FY - 14, 120, "#7fb6d6");
        const k1 = BX.callout(T(0, 0.48), FX - 60, FY - 10, "Transistor", { avoid: [[FX - 140, FY - 60, 280, 90]] });
        const L2 = BX.lens(T(0, 0.8), CX, CY + 20, 120, "#d99a7a");
        const k2 = BX.callout(T(0, 0.8), CX + 60, CY + 30, "Capacitor", { avoid: [[CX - 110, CY - 10, 220, 60]] });
        BX.show(T(0, 0.92), bit.el, { pop: true });

        // line 1: wordline on (green = active), switch closes
        BX.hide(T(1, 0), [L1, L2]); k1.hide(T(1, 0)); k2.hide(T(1, 0));
        const k3 = BX.callout(T(1, 0.1), 1500, WL, "Wordline");
        wl.color(T(1, 0.18), C.green);
        fet.chTube.color(T(1, 0.42), C.green); fet.gateTube.color(T(1, 0.42), C.green);
        const k4 = BX.callout(T(1, 0.8), BLX, 440, "Bitline", { avoid: [[BLX, FY - 20, FX - BLX, 40]] });

        // line 2: charge flows out; instruments tick together
        k3.hide(T(2, 0)); k4.hide(T(2, 0));
        BX.cam.move(T(2, 0), FX + 40, FY + 120, 1.0, 1.6);
        BX.flow(T(2, 0.05), `M${CX} ${CY - 10} V${FY} H${FX + 130} H${FX - 130} H${BLX}`, C.yellow, 4.5, { width: 7 });
        const hz = BX.stripes(T(2, 0.3), bl, 9);
        const g = BX.gauge(1600, 250, 540, { v: 0.5 });
        BX.show(T(2, 0.15), g.el);
        g.set(T(2, 0.6), 0.65, 2.2);
        const vb = BX.readout(BLX + 40, 700, 0.5, (v) => v.toFixed(2) + " V", { size: 60, color: C.yellow, t: T(2, 0) });
        const vc = BX.readout(CX - 330, CY - 10, 1.0, (v) => v.toFixed(2) + " V", { size: 60, t: T(2, 0) });
        BX.show(T(2, 0.2), [vb.el, vc.el]);
        vb.to(T(2, 0.6), 0.65, 2.2); vc.to(T(2, 0.6), 0.9, 2.2);
        cap.fill.style.transformOrigin = "50% 100%";
        tl.to(cap.fill, { opacity: 0.55, duration: 2.2 }, T(2, 0.6));

        // line 3: the sense amplifier decides
        tl.to(amp, { borderColor: C.green, boxShadow: "0 0 30px " + C.green, color: C.green, duration: 0.4 }, T(3, 0.25));
        const k5 = BX.callout(T(3, 0.85), BLX + 150, 925, "Reads 1", { color: C.green, avoid: [[BLX - 150, 860, 300, 130]] });

        // line 4: rewrite, back to a full 1 V
        k5.hide(T(4, 0.1));
        g.set(T(4, 0.35), 1.0, 1.8); vb.to(T(4, 0.35), 1.0, 1.8); vc.to(T(4, 0.6), 1.0, 1.6);
        tl.to(cap.fill, { opacity: 0.95, duration: 1.6 }, T(4, 0.6));
        BX.flow(T(4, 0.5), `M${BLX} ${FY} H${FX - 130} H${FX + 130} H${CX} V${CY - 10}`, C.green, 3, { width: 7 });

        // line 5: the takeaway as a progress list (read, rewrite)
        hz.off(T(5, 0));
        const steps = BX.progress(80, 820, ["Read", "Rewrite"], { size: 48 });
        BX.hideNow(steps.el); BX.show(T(5, 0.05), steps.el);
        steps.done(T(5, 0.15), 0); steps.done(T(5, 0.4), 1); steps.at(T(5, 0.4), 1);
        BX.dim(T(5, 0.6), [g.el, vb.el, vc.el], 0.35);
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
